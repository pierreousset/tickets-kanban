scalar DateTime
enum TicketStatus {
  todo
  in_progress
  done
  cancelled
}

type Ticket {
  id: ID!
  title: String!
  description: String!
  status: TicketStatus!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Query {
  tickets: [Ticket!]!
}

input CreateTicketInput {
  title: String!
  description: String! = ""
}

type Mutation {
  createTicket(input: CreateTicketInput!): Ticket!
  updateTicketStatus(id: ID!, status: TicketStatus!): Ticket!
  updateTicket(id: ID!, input: UpdateTicketInput!): Ticket!
  deleteTicket(id: ID!): ID!
}

input UpdateTicketInput {
  title: String!
  description: String!
}
